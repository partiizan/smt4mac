name: Build and release SMT4Mac
on:
  push:
    branches: [main, release-v0.10]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smt4mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core regression tests
        run: dotnet run --project tests/Smt.Tests -c Release -- data/universe.json
      - name: Operations regression tests
        run: dotnet run --project tests/Smt.OperationsTests -c Release -- data/universe.json --live
      - name: Desktop integration tests
        run: dotnet run --project tests/Smt.AutoSmoke -c Release
      - name: Build and verify Apple Silicon app
        run: |
          bash packaging/build-mac.sh osx-arm64
          codesign --verify --deep --strict --verbose=2 'dist/osx-arm64/SMT4Mac.app'
          file 'dist/osx-arm64/SMT4Mac.app/Contents/MacOS/SMT4Mac'
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/osx-arm64/SMT4Mac.app/Contents/Info.plist'
      - name: Native OCR bridge test
        run: |
          swiftc native/CaptureSmoke.swift -o /tmp/capture-smoke
          /tmp/capture-smoke "$PWD/dist/osx-arm64/SMT4Mac.app/Contents/MacOS/libLocalCapture.dylib"
      - name: Package app and source
        run: |
          mkdir -p /tmp/SMT4Mac-0.12.0/source
          cp -R 'dist/osx-arm64/SMT4Mac.app' /tmp/SMT4Mac-0.12.0/
          cp RELEASE-v0.12.0.md RELEASE-v0.10.md README.md LICENSE UPSTREAM-LICENSE.txt ansiblex-template.csv /tmp/SMT4Mac-0.12.0/
          git archive HEAD | tar -x -C /tmp/SMT4Mac-0.12.0/source
          ditto -c -k --sequesterRsrc --keepParent /tmp/SMT4Mac-0.12.0 /tmp/SMT4Mac-0.12.0-AppleSilicon.zip
          cd /tmp
          shasum -a 256 SMT4Mac-0.12.0-AppleSilicon.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SMT4Mac-0.12.0-AppleSilicon
          path: /tmp/SMT4Mac-0.12.0-AppleSilicon.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMT-v012-previews
          path: screenshots/*.png
          retention-days: 7
      - name: Publish v0.12.0 beta release
        if: github.ref == 'refs/heads/main' 
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then echo "Superseded build; skipping release."; exit 0; fi
          if gh release view v0.12.0 >/dev/null 2>&1; then
            echo "v0.12.0 already published; preserving its existing assets."
          else
            gh release create v0.12.0 /tmp/SMT4Mac-0.12.0-AppleSilicon.zip /tmp/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title "SMT4Mac v0.12.0 — Apple Silicon beta" --prerelease --notes-file RELEASE-v0.12.0.md
          fi
